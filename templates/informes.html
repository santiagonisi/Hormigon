{% extends "base.html" %}
{% block title %}Informes{% endblock %}

{% block content %}
<div class="container mt-4">

  <div class="card shadow p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-semibold">Promedio de Asentamientos por Clase</h4>
    </div>

    <canvas id="graficoAsentamiento" height="120"></canvas>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const clases = [
    {% for d in datos %}
      "{{ d.nombre }} ({{ d.mpa }} MPa)"{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const asentamientos = [
    {% for d in datos %}
      {{ d.cantidad }}{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const clasesURL = [
    {% for d in datos %}
      "{{ d.nombre }}"{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const ctx = document.getElementById("graficoAsentamiento").getContext("2d");

  const chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: clases,
      datasets: [{
        label: "Asentamiento promedio (cm)",
        data: asentamientos,
        backgroundColor: "rgba(54,162,235,0.6)",
        borderColor: "rgba(54,162,235,1)",
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        tooltip: {
          callbacks: {
            label: (ctx) =>
              ` ${ctx.raw.toFixed(2)} cm`
          }
        }
      },
      onClick: (evt, elements) => {
        if (elements.length > 0) {
          const idx = elements[0].index;
          const clase = clasesURL[idx];
          window.location.href = `/informes/${clase}`;
        }
      }
    }
  });
</script>

{% endblock %}
