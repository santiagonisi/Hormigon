{% extends "base.html" %}
{% block title %}Informes{% endblock %}

{% block content %}
<div class="container mt-4">

  <div class="card shadow p-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-semibold">Promedio de Asentamientos por Clase</h4>
    </div>

    <canvas id="graficoAsentamiento" height="120"></canvas>
  </div>

  <div class="card shadow p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-semibold">Resistencia Promedio por Tipo de Hormigón (MPa)</h4>
    </div>

    <canvas id="graficoResistencia" height="120"></canvas>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

  /* ================= ASENTAMIENTO ================= */

  const clases = [
    {% for d in datos %}
      "{{ d.nombre }} ({{ d.mpa }} MPa)"{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const asentamientos = [
    {% for d in datos %}
      {{ d.promedio if d.promedio is not none else 'null' }}{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const clasesURL = [
    {% for d in datos %}
      "{{ d.nombre }}"{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const ctx1 = document.getElementById("graficoAsentamiento").getContext("2d");

  new Chart(ctx1, {
    type: "bar",
    data: {
      labels: clases,
      datasets: [{
        label: "Asentamiento promedio (cm)",
        data: asentamientos,
        backgroundColor: "rgba(54,162,235,0.6)",
        borderColor: "rgba(54,162,235,1)",
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        tooltip: {
          callbacks: {
            label: (ctx) => ` ${ctx.raw?.toFixed ? ctx.raw.toFixed(2) : "Sin datos"} cm`
          }
        }
      },
      onClick: (evt, elements) => {
        if (elements.length > 0) {
          const idx = elements[0].index;
          const clase = clasesURL[idx];
          window.location.href = `/informes/${clase}`;
        }
      }
    }
  });

  /* ================= RESISTENCIA ================= */

  const tipos = [
    {% for d in datos %}
      "{{ d.nombre }}"{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const promediosRes = [
    {% for d in datos %}
      {{ d.promedio_resistencia if d.promedio_resistencia is not none else 'null' }}{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const objetivosRes = [
    {% for d in datos %}
      {{ d.objetivo_resistencia if d.objetivo_resistencia is not none else 'null' }}{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const ctx2 = document.getElementById("graficoResistencia").getContext("2d");

  new Chart(ctx2, {
    type: "bar",
    data: {
      labels: tipos,
      datasets: [
        {
          label: "Resistencia promedio (MPa)",
          data: promediosRes,
          borderWidth: 1
        },
        {
          label: "Objetivo (MPa)",
          type: "line",
          data: objetivosRes,
          borderWidth: 2,
          borderDash: [6, 4],
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        tooltip: {
          callbacks: {
            label: (ctx) => ` ${ctx.raw ?? "Sin datos"} MPa`
          }
        },
        legend: { position: "bottom" }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: { display: true, text: "MPa" }
        }
      }
    }
  });

</script>

{% endblock %}
