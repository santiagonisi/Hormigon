{% extends "base.html" %}
{% block title %}Obras — Sistema de Hormigón{% endblock %}

{% block content %}
<div class="card shadow p-3">
  <h4 class="mb-3 fw-semibold">Lista de Obras</h4>

  <div class="table-responsive">
    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th style="width:80px;">ID</th>
          <th>Nombre</th>
          <th style="width:160px;">Fecha</th>
          <th style="width:100px;" class="text-center">Editar</th>
        </tr>
      </thead>
      <tbody>
        {% for o in obras %}
        <tr>
          <td>{{ o.id }}</td>
          <td>{{ o.nombre }}</td>
          <td>{% if o.fecha %}{{ o.fecha.strftime('%d/%m/%Y') }}{% endif %}</td>
          <td class="text-center">
            <a href="#" class="btn btn-warning btn-sm text-white"><i class="bi bi-pencil-square"></i></a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
