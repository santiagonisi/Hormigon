{% extends "base.html" %}
{% block title %}Fórmulas — Sistema de Hormigón{% endblock %}

{% block content %}
<div class="card shadow p-4">
    <h4 class="mb-4 fw-semibold text-center">Fórmulas de Dosificación</h4>

    <!-- Formulario principal -->
    <form id="formFormula">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="tipoHormigon" class="form-label">Tipo de Hormigón</label>
                <input type="text" id="tipoHormigon" name="tipoHormigon" class="form-control" placeholder="Ej: H-21, H-25, H-30..." required>
            </div>
            <div class="col-md-6 d-flex align-items-end justify-content-end">
                <button type="button" id="agregarFila" class="btn btn-dark">
                    <i class="bi bi-plus-circle"></i> Agregar Material
                </button>
            </div>
        </div>

        <!-- Tabla dinámica de materiales -->
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width: 60px;">#</th>
                        <th>Material</th>
                        <th style="width: 160px;">Cantidad</th>
                        <th style="width: 160px;">Unidad</th>
                        <th style="width: 100px;">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaMateriales">
                    <!-- Filas agregadas dinámicamente -->
                </tbody>
            </table>
        </div>

        <div class="text-end mt-4">
            <button type="submit" class="btn btn-dark">Guardar Fórmula</button>
            <button type="reset" class="btn btn-secondary ms-2">Limpiar</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script>
document.addEventListener('DOMContentLoaded', () => {
    const tabla = document.getElementById('tablaMateriales');
    const btnAgregar = document.getElementById('agregarFila');
    let contador = 0;

    btnAgregar.addEventListener('click', () => {
        contador++;
        const fila = document.createElement('tr');
        fila.innerHTML = `
            <td class="text-center">${contador}</td>
            <td><input type="text" name="material_${contador}" class="form-control" placeholder="Nombre del material" required></td>
            <td><input type="number" step="0.01" name="cantidad_${contador}" class="form-control" placeholder="0.00" required></td>
            <td>
                <select name="unidad_${contador}" class="form-select">
                    <option value="kg">kg</option>
                    <option value="m3">m³</option>
                    <option value="lts">lts</option>
                    <option value="unidades">unidades</option>
                </select>
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-sm btn-danger eliminar-fila">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        `;
        tabla.appendChild(fila);
    });

    // Eliminar fila
    tabla.addEventListener('click', (e) => {
        if (e.target.closest('.eliminar-fila')) {
            e.target.closest('tr').remove();
        }
    });
});
</script>
{% endblock %}
