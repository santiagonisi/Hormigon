{% extends "base.html" %}
{% block title %}Fórmulas — Sistema de Hormigón{% endblock %}

{% block content %}
<div class="card shadow p-4">
  <h4 class="mb-4 fw-semibold text-center">Fórmulas de Dosificación</h4>

  <form id="formFormula">
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="tipoHormigon" class="form-label">Tipo de Hormigón</label>
        <input type="text" id="tipoHormigon" name="tipoHormigon" class="form-control" placeholder="Ej: H-21, H-25, H-30..." required>
      </div>
      <div class="col-md-6 d-flex align-items-end justify-content-end">
        <button type="button" id="agregarFila" class="btn btn-dark">
          <i class="bi bi-plus-circle"></i> Agregar Material
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-light">
          <tr>
            <th style="width:60px;">#</th>
            <th>Material</th>
            <th style="width:160px;">Cantidad</th>
            <th style="width:160px;">Unidad</th>
            <th style="width:100px;">Acción</th>
          </tr>
        </thead>
        <tbody id="tablaMateriales"></tbody>
      </table>
    </div>

    <div class="text-end mt-4">
      <button type="submit" class="btn btn-dark">Guardar Fórmula</button>
      <button type="reset" class="btn btn-secondary ms-2">Limpiar</button>
    </div>
  </form>
</div>
{% endblock %}
