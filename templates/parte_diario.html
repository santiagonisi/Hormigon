{% extends "base.html" %}
{% block title %}Parte Diario — Sistema de Hormigón{% endblock %}

{% block content %}
<div class="card shadow p-4">
    <h4 class="mb-4 text-center fw-semibold">Parte Diario de Hormigón</h4>

    <form id="parteForm">
        <div class="row mb-3">
            <div class="col-md-2">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" name="fecha" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Obra</label>
                <select class="form-select" name="obra" required>
                    <option value="">Seleccione una obra</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Clase (Tipo de Hormigón)</label>
                <select class="form-select" name="tipo_hormigon" required>
                    <option value="">Seleccione clase</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Hora Despacho</label>
                <input type="time" class="form-control" name="hora_despacho">
            </div>
            <div class="col-md-2">
                <label class="form-label">Cantidad (m³)</label>
                <input type="number" step="0.01" class="form-control" name="cantidad_m3" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-2">
                <label class="form-label">Asentamiento (cm)</label>
                <input type="number" step="0.1" class="form-control" name="asentamiento_cm">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkProbetas">
                    <label class="form-check-label" for="checkProbetas">Usa probetas</label>
                </div>
            </div>
        </div>

        <div id="probetasSection" class="mt-3" style="display:none;">
            <h5 class="fw-semibold">Probetas</h5>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 50px;">#</th>
                            <th>Fecha Ensayo</th>
                            <th>Edad (días)</th>
                            <th>Lectura Prensa (kN)</th>
                            <th>Resistencia (MPa)</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProbetas">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-end mt-4">
            <button type="submit" class="btn btn-dark">Guardar</button>
            <button type="reset" class="btn btn-secondary ms-2">Limpiar</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const checkProbetas = document.getElementById('checkProbetas');
    const probetasSection = document.getElementById('probetasSection');
    const tablaProbetas = document.getElementById('tablaProbetas');

    checkProbetas.addEventListener('change', () => {
        if (checkProbetas.checked) {
            probetasSection.style.display = 'block';
            generarFilasProbetas();
        } else {
            probetasSection.style.display = 'none';
            tablaProbetas.innerHTML = '';
        }
    });

    function generarFilasProbetas() {
        tablaProbetas.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
            const fila = `
                <tr>
                    <td>${i}</td>
                    <td><input type="date" class="form-control" name="fecha_ensayo_${i}"></td>
                    <td><input type="number" class="form-control" name="edad_${i}" step="1"></td>
                    <td><input type="number" class="form-control" name="lectura_${i}" step="0.01"></td>
                    <td><input type="number" class="form-control" name="resistencia_${i}" step="0.01" readonly></td>
                </tr>
            `;
            tablaProbetas.insertAdjacentHTML('beforeend', fila);
        }
    }
});
</script>
{% endblock %}
