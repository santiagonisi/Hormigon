{% extends "base.html" %}
{% block title %}Detalle Informe{% endblock %}

{% block content %}
<div class="container mt-4">

  <a href="/informes" class="btn btn-secondary mb-3">⬅ Volver</a>

  <div class="card shadow p-4">
    <h4 class="fw-semibold mb-4">Detalle de {{ clase.nombre }}</h4>

    <canvas id="graficoDetalle" height="120"></canvas>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const fechas = {{ fechas | tojson }};
  const asentamientos = {{ asentamientos | tojson }};

  const refMas = asentamientos.map(() => 2);
  const refMenos = asentamientos.map(() => -2);

  const ctx = document.getElementById("graficoDetalle").getContext("2d");

  new Chart(ctx, {
    type: "line",
    data: {
      labels: fechas,
      datasets: [
        {
          label: "Asentamiento (cm)",
          data: asentamientos,
          borderWidth: 2,
          tension: 0.3
        },
        {
          label: "+2 cm",
          data: refMas,
          borderDash: [5, 5],
          borderWidth: 1,
          fill: false
        },
        {
          label: "-2 cm",
          data: refMenos,
          borderDash: [5, 5],
          borderWidth: 1,
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "bottom" }
      }
    }
  });
</script>

{% endblock %}
