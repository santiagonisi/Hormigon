<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Hormigón{% endblock %}</title>

    <!-- Bootstrap + Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
      #scrollTopButton {
        opacity: 0;
        visibility: hidden;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #scrollTopButton.show {
        opacity: 1;
        visibility: visible;
      }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark iarsa-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('parte_diario') }}">
                <img src="{{ url_for('static', filename='images/isologo-IARSA.png') }}" alt="Logo" width="40" height="40" class="me-2 iarsa-logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/parte_diario') %}active{% endif %}" href="{{ url_for('parte_diario') }}">Parte Diario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/obras') %}active{% endif %}" href="{{ url_for('obras') }}">Obras</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/formulas') %}active{% endif %}" href="{{ url_for('formulas') }}">Fórmulas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/informes') %}active{% endif %}" href="{{ url_for('informes_page') }}">Informes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <a href="#" id="scrollTopButton" class="btn btn-primary rounded-circle shadow" title="Volver arriba">
      <i class="bi bi-arrow-up"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block scripts %}{% endblock %}
  </body>
</html>
